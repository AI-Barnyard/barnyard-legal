<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barnyard Templates</title>
<style>
  :root {
    --paper: #f5f0e6;
    --ink: #2b2320;
    --ink-soft: #5b4f45;
    --barn: #8c3b2e;
    --gold: #b98a3e;
    --line: #d8cbb3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #221d19;
      --ink: #ede3d3;
      --ink-soft: #b9ac97;
      --barn: #e07856;
      --gold: #d9a94f;
      --line: #3c332b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Karla", -apple-system, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem;
  }
  .card {
    max-width: 480px;
    text-align: center;
  }
  .glyph {
    font-family: Georgia, serif;
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--barn);
    border: 1.5px solid var(--barn);
    border-radius: 3px;
    padding: 0.15rem 0.6rem;
    display: inline-block;
    transform: rotate(-2deg);
    margin-bottom: 1.25rem;
  }
  h1 { font-size: 1.9rem; margin: 0 0 0.75rem; }
  p { color: var(--ink-soft); line-height: 1.6; }
  a { color: var(--barn); }
  .links {
    margin-top: 1.75rem;
    display: flex;
    gap: 1.5rem;
    justify-content: center;
    font-size: 0.95rem;
  }
</style>
</head>
<body>
  <div class="card">
    <span class="glyph">B</span>
    <h1>Barnyard Templates</h1>
    <p>Digital templates &amp; tools that save you time. New drops weekly.</p>
    <div class="links">
      <a href="https://www.instagram.com/barnyardtemplates/" target="_blank" rel="noopener">Instagram</a>
      <a href="./privacy.html">Privacy Policy</a>
      <a href="mailto:clawopener@gmail.com">Contact</a>
    </div>
  </div>
</body>
</html>
